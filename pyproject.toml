[project]
name = "psyonic-ble"
version = "0.1.0"
description = "Command line control of a PSYONIC Ability Hand over Bluetooth LE"
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["bleak>=0.22"]

[project.scripts]
psyonic-ble = "psyonic_ble.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["psyonic_ble"]

[dependency-groups]
dev = ["pytest"]
